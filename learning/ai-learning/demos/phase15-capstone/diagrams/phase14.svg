<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830.0 440.0" width="830.0" height="440.0" role="img" aria-label="Four levers are applied to a domain agent and compared against a baseline holding model, tools and temperature constant, so the levers are the only variable.">
